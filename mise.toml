# Tools outside the Gradle build. The JDKs stay with the Gradle toolchains.
# The TypeSafe API key for jev-lint goes in mise.local.toml, which Git ignores:
#   [env]
#   TYPESAFE_API_KEY = "..."
[tools]
node = "24"
# mise skips install scripts by default, and @ast-grep/cli puts its binary in place with one. mise also refuses a package
# first published less than 30 days ago; jev-lint was on 2026-09-19, so allow_low_downloads approves it until then and
# can go after 2026-10-19. Both options need mise 2026.10 or later.
"npm:jev-lint" = { version = "0.7.0", allow_builds = ["@ast-grep/cli"], allow_low_downloads = true }

# Without a base, the review covers what is not pushed yet, since commits usually go straight to master. On a branch,
# pass the ref it started from: mise run jev-review master
[tasks.jev-review]
description = "Judge the lines changed since a base ref (origin/master by default) with jev-lint"
usage = 'arg "[base]" help="The ref to review the changes since" default="origin/master"'
run = "jev-lint review --base {{usage.base}}"
